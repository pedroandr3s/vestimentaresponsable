<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Riesgos en Obra - Seguridad Laboral</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            padding: 40px;
            max-width: 650px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-icon {
            font-size: 56px;
            margin-bottom: 10px;
        }

        h1 {
            color: #1a1a2e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #0f3460;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #f8f9ff 0%, #e8ecf4 100%);
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #e94560;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe8ec 100%);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #e94560;
            background: linear-gradient(135deg, #ffe8ec 0%, #ffd6de 100%);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-subtext {
            color: #888;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .preview-container {
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .preview-wrapper {
            position: relative;
            display: inline-block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn-remove {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #e94560;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(233, 69, 96, 0.4);
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            background: #c73e54;
            transform: scale(1.1);
        }

        .btn-analyze {
            background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-analyze:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(233, 69, 96, 0.4);
        }

        .btn-analyze:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e8ecf4;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #0f3460;
            font-size: 15px;
            font-weight: 500;
        }

        .result {
            display: none;
            padding: 25px;
            border-radius: 16px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
        }

        .result.warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
            border: 2px solid #ffc107;
        }

        .result.error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .result-icon {
            font-size: 36px;
        }

        .result-title {
            font-weight: 700;
            font-size: 20px;
        }

        .result.success .result-title { color: #155724; }
        .result.warning .result-title { color: #856404; }
        .result.error .result-title { color: #721c24; }

        .result-content {
            font-size: 15px;
            line-height: 1.6;
        }

        .result.success .result-content { color: #155724; }
        .result.warning .result-content { color: #856404; }
        .result.error .result-content { color: #721c24; }

        .safety-items {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .safety-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 500;
        }

        .safety-item.ok {
            background: rgba(40, 167, 69, 0.15);
            color: #155724;
        }

        .safety-item.missing {
            background: rgba(220, 53, 69, 0.15);
            color: #721c24;
        }

        .safety-item-icon {
            font-size: 20px;
        }

        .description-box {
            margin-top: 15px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            font-size: 14px;
            font-style: italic;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .stat-card {
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 4px;
        }

        .risk-item {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.4);
        }

        .risk-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .risk-badge.critico {
            background: #dc3545;
            color: white;
        }

        .risk-badge.alto {
            background: #ff6b6b;
            color: white;
        }

        .risk-badge.medio {
            background: #ffc107;
            color: #333;
        }

        .risk-badge.bajo {
            background: #90CAF9;
            color: #1565C0;
        }

        .recommendations-list {
            margin-top: 15px;
        }

        .recommendation-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .section-title {
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .btn-reset {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-reset:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e8ecf4;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🏗️</div>
            <h1>Análisis de Riesgos en Obra</h1>
            <p class="subtitle">Detección inteligente de riesgos y EPP con IA</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Arrastra una imagen o haz clic para seleccionar</div>
            <div class="upload-subtext">JPG, PNG, WebP • Máximo 10MB</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif">
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="preview-wrapper">
                <img id="previewImage" class="preview-image" alt="Vista previa">
                <button class="btn-remove" onclick="resetForm()" title="Quitar imagen">✕</button>
            </div>
        </div>

        <button class="btn-analyze" id="btnAnalyze">🔍 Analizar Seguridad</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Analizando imagen con IA...</p>
        </div>

        <div class="result" id="result">
            <div class="result-header">
                <span class="result-icon" id="resultIcon"></span>
                <span class="result-title" id="resultTitle"></span>
            </div>
            <div class="result-content" id="resultContent"></div>
            <button class="btn-reset" onclick="resetForm()">📷 Analizar otra imagen</button>
        </div>

        <div class="footer">
            Powered by Gemini Vision AI • Naitus
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://naitus.app.n8n.cloud/webhook/6f7b288e-1efe-4504-a6fd-660931327269';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const btnAnalyze = document.getElementById('btnAnalyze');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        }

        function handleFile(file) {
            const validTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
            
            if (!validTypes.includes(file.type)) {
                showError('Formato no soportado', 'Por favor usa JPG, PNG, WebP o GIF');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                showError('Archivo muy grande', 'La imagen debe ser menor a 10MB');
                return;
            }

            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                uploadArea.style.display = 'none';
                btnAnalyze.style.display = 'block';
                result.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        btnAnalyze.addEventListener('click', analyzeImage);

        async function analyzeImage() {
            if (!selectedFile) return;

            btnAnalyze.style.display = 'none';
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const base64 = await fileToBase64(selectedFile);

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: base64,
                        filename: selectedFile.name
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const jsonResponse = await response.json();
                console.log('Respuesta:', jsonResponse);
                
                // Procesar respuesta
                const data = parseResponse(jsonResponse);
                displayResult(data);

            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión', `No se pudo conectar con el servidor. ${error.message}`);
            } finally {
                loading.style.display = 'none';
            }
        }

        function parseResponse(jsonResponse) {
            try {
                let data = Array.isArray(jsonResponse) ? jsonResponse[0] : jsonResponse;

                if (data.reporte) {
                    return data.reporte;
                }

                return {
                    tiene_casco: data.tiene_casco || false,
                    tiene_chaleco: data.tiene_chaleco || false,
                    descripcion: data.descripcion_detallada || data.descripcion || 'Sin descripción'
                };
            } catch (e) {
                console.error('Error parseando:', e);
                return {
                    error: true,
                    descripcion: 'Error al procesar la respuesta'
                };
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        function displayResult(data) {
            result.style.display = 'block';

            if (data.resultado_general) {
                displayRiskReport(data);
            } else {
                displayLegacyResult(data);
            }
        }

        function displayRiskReport(data) {
            const resultadoGeneral = data.resultado_general;
            const estadisticas = data.estadisticas;
            const riesgos = data.riesgos_detectados || [];
            const aspectos = data.aspectos_seguros || [];
            const recomendaciones = data.recomendaciones_urgentes || [];

            if (!resultadoGeneral.es_imagen_obra) {
                result.className = 'result error';
                resultIcon.textContent = '❌';
                resultTitle.textContent = 'No es imagen de obra';
                resultContent.innerHTML = '<p>La imagen no parece ser de un sitio de construcción.</p>';
                return;
            }

            let resultClass = 'result success';
            let icon = '✅';
            let title = resultadoGeneral.estado_seguridad;

            if (resultadoGeneral.nivel_riesgo === 'CRITICO') {
                resultClass = 'result error';
                icon = '🔴';
            } else if (resultadoGeneral.nivel_riesgo === 'ALTO') {
                resultClass = 'result error';
                icon = '🟠';
            } else if (resultadoGeneral.nivel_riesgo === 'MEDIO') {
                resultClass = 'result warning';
                icon = '🟡';
            } else {
                resultClass = 'result success';
                icon = '🟢';
            }

            result.className = resultClass;
            resultIcon.textContent = icon;
            resultTitle.textContent = title;

            let contentHtml = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-number">${estadisticas.total_riesgos}</span>
                        <span class="stat-label">Total Riesgos</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">${estadisticas.riesgos_criticos}</span>
                        <span class="stat-label">Críticos</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">${estadisticas.riesgos_altos}</span>
                        <span class="stat-label">Altos</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number">${estadisticas.riesgos_medios}</span>
                        <span class="stat-label">Medios</span>
                    </div>
                </div>
            `;

            if (riesgos.length > 0) {
                contentHtml += '<div class="section-title">⚠️ Riesgos Detectados</div>';
                riesgos.forEach(riesgo => {
                    const gravedadClass = riesgo.gravedad.toLowerCase();
                    contentHtml += `
                        <div class="risk-item">
                            <span class="risk-badge ${gravedadClass}">${riesgo.gravedad}</span>
                            <div>
                                <div style="font-weight: 600; margin-bottom: 4px;">${riesgo.categoria}</div>
                                <div style="font-size: 13px;">${riesgo.descripcion}</div>
                                <div style="font-size: 12px; opacity: 0.7; margin-top: 2px;">📍 ${riesgo.ubicacion}</div>
                            </div>
                        </div>
                    `;
                });
            }

            if (aspectos.length > 0) {
                contentHtml += '<div class="section-title">✅ Aspectos Seguros</div>';
                aspectos.forEach(aspecto => {
                    contentHtml += `
                        <div class="safety-item ok">
                            <span class="safety-item-icon">✓</span>
                            <span>${aspecto}</span>
                        </div>
                    `;
                });
            }

            if (recomendaciones.length > 0) {
                contentHtml += '<div class="section-title">🔧 Recomendaciones Urgentes</div>';
                contentHtml += '<div class="recommendations-list">';
                recomendaciones.forEach((rec, index) => {
                    contentHtml += `
                        <div class="recommendation-item">
                            <span>${index + 1}.</span>
                            <span>${rec}</span>
                        </div>
                    `;
                });
                contentHtml += '</div>';
            }

            if (data.resumen_ejecutivo) {
                contentHtml += `<div class="description-box">${data.resumen_ejecutivo}</div>`;
            }

            resultContent.innerHTML = contentHtml;
        }

        function displayLegacyResult(data) {
            const cumple = data.tiene_casco && data.tiene_chaleco;

            if (cumple) {
                result.className = 'result success';
                resultIcon.textContent = '✅';
                resultTitle.textContent = 'Cumple con Seguridad';
                resultContent.innerHTML = `
                    <div class="safety-items">
                        <div class="safety-item ok">
                            <span class="safety-item-icon">🪖</span>
                            <span>Casco de seguridad detectado</span>
                        </div>
                        <div class="safety-item ok">
                            <span class="safety-item-icon">🦺</span>
                            <span>Chaleco reflectante detectado</span>
                        </div>
                    </div>
                    <div class="description-box">"${data.descripcion}"</div>
                `;
            } else {
                result.className = 'result warning';
                resultIcon.textContent = '⚠️';
                resultTitle.textContent = 'Equipo Incompleto';

                let itemsHtml = '<div class="safety-items">';

                if (data.tiene_casco) {
                    itemsHtml += `
                        <div class="safety-item ok">
                            <span class="safety-item-icon">🪖</span>
                            <span>Casco de seguridad detectado</span>
                        </div>`;
                } else {
                    itemsHtml += `
                        <div class="safety-item missing">
                            <span class="safety-item-icon">❌</span>
                            <span>Falta casco de seguridad</span>
                        </div>`;
                }

                if (data.tiene_chaleco) {
                    itemsHtml += `
                        <div class="safety-item ok">
                            <span class="safety-item-icon">🦺</span>
                            <span>Chaleco reflectante detectado</span>
                        </div>`;
                } else {
                    itemsHtml += `
                        <div class="safety-item missing">
                            <span class="safety-item-icon">❌</span>
                            <span>Falta chaleco reflectante</span>
                        </div>`;
                }

                itemsHtml += '</div>';

                resultContent.innerHTML = itemsHtml + `<div class="description-box">"${data.descripcion}"</div>`;
            }
        }

        function showError(title, message) {
            result.style.display = 'block';
            result.className = 'result error';
            resultIcon.textContent = '❌';
            resultTitle.textContent = title;
            resultContent.innerHTML = `<p>${message}</p>`;
            loading.style.display = 'none';
            btnAnalyze.style.display = 'block';
        }

        function resetForm() {
            selectedFile = null;
            fileInput.value = '';
            previewContainer.style.display = 'none';
            btnAnalyze.style.display = 'none';
            result.style.display = 'none';
            uploadArea.style.display = 'block';
        }
    </script>
</body>
</html>
