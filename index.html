<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de EPP - Gemini Vision</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background-color: #f8f9ff;
        }

        .upload-area.dragover {
            background-color: #e8ecff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .preview {
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .filename {
            color: #667eea;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-all;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 20px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border-left: 5px solid #28a745;
        }

        .result.warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%);
            border-left: 5px solid #ffc107;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .result-message {
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .result-details {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .result-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 14px;
        }

        .result-item .icon {
            margin-right: 10px;
            font-size: 20px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .status.loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }

        .api-key-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #856404;
        }

        .api-key-notice strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Detector de EPP</h1>
        <div class="subtitle">Análisis automático con Gemini Vision AI</div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Haz clic o arrastra una imagen aquí</div>
            <div style="font-size: 12px; color: #999; margin-top: 5px;">
                Se verificará: Casco de seguridad y Chaleco reflectante
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview" id="preview">
            <img id="previewImg" src="" alt="Vista previa">
            <div class="filename" id="filename"></div>
        </div>

        <button id="analyzeBtn" disabled>Analizar EPP</button>

        <div class="status" id="status"></div>
        <div class="result" id="result"></div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN: API KEY DE GEMINI
        // ============================================
        const GEMINI_API_KEY = 'AIzaSyBuFjBcMx0Giik5oZka--0PWwR_IIHj1AU';
        // ============================================

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const filename = document.getElementById('filename');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        let selectedFile = null;
        let base64Data = null;

        // Click para seleccionar archivo
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Prevenir comportamiento por defecto del drag
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Efectos visuales para drag and drop
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('dragover');
            });
        });

        // Manejar drop
        uploadArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // Manejar selección de archivo
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('Por favor selecciona una imagen válida', 'error');
                return;
            }

            selectedFile = file;

            // Mostrar preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
                filename.textContent = file.name;
            };
            reader.readAsDataURL(file);

            // Convertir a base64 (sin el prefijo data:image)
            const base64Reader = new FileReader();
            base64Reader.onload = (e) => {
                base64Data = e.target.result.split(',')[1];
                analyzeBtn.disabled = false;
            };
            base64Reader.readAsDataURL(file);

            hideStatus();
            hideResult();
        }

        // Analizar imagen con Gemini
        analyzeBtn.addEventListener('click', async () => {
            if (!base64Data || !selectedFile) {
                showStatus('❌ No hay imagen seleccionada', 'error');
                return;
            }

            if (GEMINI_API_KEY === 'TU_API_KEY_AQUI') {
                showStatus('❌ Error: Debes configurar tu API Key de Gemini en el código', 'error');
                console.error('CONFIGURACIÓN REQUERIDA: Edita el HTML y coloca tu API Key en la línea 290');
                return;
            }

            analyzeBtn.disabled = true;
            showStatus('🔍 Analizando imagen con Gemini Vision AI...', 'loading');
            hideResult();

            console.log('�� Iniciando análisis...');
            console.log('📁 Archivo:', selectedFile.name);
            console.log('📏 Tamaño base64:', base64Data.length, 'caracteres');

            try {
                // Paso 1: Llamar a Gemini Vision API
                const geminiResponse = await callGeminiAPI(base64Data);
                console.log('✅ Respuesta de Gemini recibida:', geminiResponse);

                // Paso 2: Procesar resultado
                const processedResult = processGeminiResponse(geminiResponse);
                console.log('✅ Resultado procesado:', processedResult);

                // Paso 3: Mostrar resultado
                displayResult(processedResult);
                hideStatus();

            } catch (error) {
                console.error('❌ Error:', error);
                showStatus(`❌ Error: ${error.message}`, 'error');
            } finally {
                analyzeBtn.disabled = false;
            }
        });

        async function callGeminiAPI(imageBase64) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${GEMINI_API_KEY}`;

            const requestBody = {
                contents: [
                    {
                        parts: [
                            {
                                text: `Eres un inspector de seguridad en obras de construcción. Analiza esta imagen y determina si el trabajador está usando:

1. CASCO de seguridad (cualquier tipo de casco protector en la cabeza)
2. CHALECO REFLECTANTE (chaleco de alta visibilidad, usualmente amarillo, naranja o verde con franjas reflectantes)

Responde ÚNICAMENTE en formato JSON con esta estructura exacta, sin markdown ni texto adicional:
{"tiene_casco": true, "tiene_chaleco": false, "descripcion": "descripcion breve"}

Sé muy específico y objetivo. Si no estás seguro de algo, márcalo como false.`
                            },
                            {
                                inline_data: {
                                    mime_type: "image/jpeg",
                                    data: imageBase64
                                }
                            }
                        ]
                    }
                ],
                generationConfig: {
                    temperature: 0.1,
                    maxOutputTokens: 500
                }
            };

            console.log('🌐 Llamando a Gemini API...');
            const startTime = Date.now();

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            const responseTime = Date.now() - startTime;
            console.log(`⏱️ Tiempo de respuesta de Gemini: ${responseTime}ms`);

            if (!response.ok) {
                const errorData = await response.json();
                console.error('Error de Gemini API:', errorData);
                throw new Error(`Error de Gemini API: ${errorData.error?.message || response.statusText}`);
            }

            const data = await response.json();
            return data;
        }

        function processGeminiResponse(geminiResponse) {
            // Extraer la respuesta de Gemini
            const geminiText = geminiResponse.candidates[0].content.parts[0].text;
            console.log('📝 Texto de Gemini:', geminiText);

            // Limpiar posibles markdown code blocks
            let jsonString = geminiText.trim();
            if (jsonString.startsWith('```json')) {
                jsonString = jsonString.replace(/```json\n?/g, '').replace(/```\n?/g, '');
            } else if (jsonString.startsWith('```')) {
                jsonString = jsonString.replace(/```\n?/g, '');
            }

            // Parsear el JSON
            let analisis;
            try {
                analisis = JSON.parse(jsonString);
            } catch (e) {
                console.warn('⚠️ Error parseando JSON, intentando extracción manual:', e);
                // Si falla el parseo, intentar extraer valores manualmente
                analisis = {
                    tiene_casco: jsonString.toLowerCase().includes('"tiene_casco": true') ||
                                 jsonString.toLowerCase().includes('"tiene_casco":true'),
                    tiene_chaleco: jsonString.toLowerCase().includes('"tiene_chaleco": true') ||
                                   jsonString.toLowerCase().includes('"tiene_chaleco":true'),
                    descripcion: 'No se pudo procesar la descripción correctamente'
                };
            }

            // Determinar cumplimiento
            const cumple = analisis.tiene_casco && analisis.tiene_chaleco;

            // Crear mensaje personalizado
            let mensaje = '';
            let falta = '';

            if (cumple) {
                mensaje = '✅ El trabajador cumple con todos los requisitos de seguridad. Se observa uso correcto de casco y chaleco reflectante.';
            } else {
                const faltantes = [];

                if (!analisis.tiene_casco) {
                    faltantes.push('casco de seguridad');
                }

                if (!analisis.tiene_chaleco) {
                    faltantes.push('chaleco reflectante');
                }

                falta = faltantes.join(' y ');
                mensaje = `⚠️ Se detectaron ${faltantes.length} elemento(s) de protección faltante(s). ${analisis.descripcion}`;
            }

            return {
                cumple: cumple,
                tiene_casco: analisis.tiene_casco,
                tiene_chaleco: analisis.tiene_chaleco,
                mensaje: mensaje,
                falta: falta,
                descripcion_detallada: analisis.descripcion,
                timestamp: new Date().toISOString()
            };
        }

        function displayResult(data) {
            const resultClass = data.cumple ? 'success' : 'warning';
            const icon = data.cumple ? '✅' : '⚠️';
            const title = data.cumple ? '¡Cumplimiento Total!' : '¡Atención Requerida!';

            result.className = `result ${resultClass}`;
            result.innerHTML = `
                <div class="result-icon">${icon}</div>
                <div class="result-title">${title}</div>
                <div class="result-message">${data.mensaje}</div>
                <div class="result-details">
                    <div class="result-item">
                        <span class="icon">${data.tiene_casco ? '✅' : '❌'}</span>
                        <span>Casco de seguridad: <strong>${data.tiene_casco ? 'SÍ' : 'NO'}</strong></span>
                    </div>
                    <div class="result-item">
                        <span class="icon">${data.tiene_chaleco ? '✅' : '❌'}</span>
                        <span>Chaleco reflectante: <strong>${data.tiene_chaleco ? 'SÍ' : 'NO'}</strong></span>
                    </div>
                    ${!data.cumple ? `
                    <div class="result-item" style="margin-top: 10px; color: #d9534f;">
                        <span class="icon">⚠️</span>
                        <span><strong>Falta:</strong> ${data.falta}</span>
                    </div>
                    ` : ''}
                </div>
                <div class="timestamp">Análisis realizado: ${new Date(data.timestamp).toLocaleString('es-ES')}</div>
            `;
            result.style.display = 'block';
        }

        function showStatus(message, type) {
            status.className = 'status ' + type;
            if (type === 'loading') {
                status.innerHTML = '<div class="spinner"></div>' + message;
            } else {
                status.textContent = message;
            }
            status.style.display = 'block';
        }

        function hideStatus() {
            status.style.display = 'none';
        }

        function hideResult() {
            result.style.display = 'none';
        }
    </script>
</body>
</html>
